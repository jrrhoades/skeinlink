version: '3.8'

volumes:
  sql_persistent:

services:
  db:
    image: mariadb:10.11  # Compatible with MySQL, supported
    volumes:
      - sql_persistent:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: skeinlink_production  # Auto-creates DB

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      DATABASE_HOST: db  # For config/database.yml
    depends_on:
      - db
